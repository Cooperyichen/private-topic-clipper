[project]
name = "second-brain-clipper"
version = "0.1.0"
description = "Private, Tailscale-only clipping inbox for the second-brain vault"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.120.0",
  "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
ocr = ["mineru==4.0.9"]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.14.3",
]

[project.scripts]
clipper-worker = "app.worker:main"
clipper-backup = "app.backup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

